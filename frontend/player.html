<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title data-i18n="app_title_player">Acme Talent · Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="i18n.js"></script>
<style>

  :root {
    --navy: #1E293B;
    --gold: #6366F1;
    --beige: #C7D2FE;

    --bg: #FAF8F5;
    --white: #ffffff;
    --grey: #888888;
    --border: #e0e0e0;
    --text: #2c2c2c;
    --success: #1E293B;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  .k-header {
    background: var(--navy);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .k-logo { color: var(--gold); font-size: 18px; font-weight: 700; letter-spacing: 3px; }
  .k-logo span { color: #aaa; font-size: 10px; font-weight: 400; letter-spacing: 1px; display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  .k-timer {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 20px;
    padding: 6px 18px;
    color: var(--gold);
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 80px;
    text-align: center;
  }
  .k-timer.warning { color: #e87a38; border-color: rgba(232,122,56,0.5); }
  .k-progress-wrap { display: flex; align-items: center; gap: 10px; }
  .k-progress-label { color: #aaa; font-size: 12px; }
  .k-progress-bar { width: 120px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  .k-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s; }

  .k-content { flex: 1; padding: 40px; max-width: 860px; margin: 0 auto; width: 100%; }

  #screen-intro { background: var(--navy); align-items: center; justify-content: center; text-align: center; }
  .intro-logo { color: var(--gold); font-size: 42px; font-weight: 700; letter-spacing: 6px; margin-bottom: 8px; }
  .intro-sub { color: #aaa; font-size: 13px; letter-spacing: 2px; margin-bottom: 48px; }
  .intro-title { color: var(--white); font-size: 24px; font-weight: 300; margin-bottom: 12px; }
  .intro-name { color: var(--gold); font-size: 28px; font-weight: 600; margin-bottom: 40px; }
  .intro-modules { display: flex; gap: 16px; margin-bottom: 48px; flex-wrap: wrap; justify-content: center; }
  .intro-module { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 14px 20px; text-align: left; min-width: 160px; }
  .intro-module .mod-label { color: #aaa; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
  .intro-module .mod-name { color: var(--white); font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .intro-module .mod-time { color: var(--gold); font-size: 12px; }
  .intro-note { color: #aaa; font-size: 13px; line-height: 1.7; max-width: 480px; margin-bottom: 40px; }

  #screen-module-intro { background: var(--white); align-items: center; justify-content: center; }
  .mi-wrap { text-align: center; max-width: 540px; padding: 40px; }
  .mi-num { color: var(--gold); font-size: 13px; letter-spacing: 2px; font-weight: 600; margin-bottom: 12px; }
  .mi-title { color: var(--navy); font-size: 32px; font-weight: 700; margin-bottom: 16px; }
  .mi-desc { color: var(--grey); font-size: 15px; line-height: 1.7; margin-bottom: 12px; }
  .mi-time { display: inline-block; background: rgba(30,41,59,0.06); border-radius: 20px; padding: 6px 18px; color: var(--navy); font-size: 13px; font-weight: 600; margin-bottom: 40px; }
  .mi-instruction { background: #f8f7f2; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 16px 20px; text-align: left; color: #555; font-size: 14px; line-height: 1.7; margin-bottom: 40px; }

  .q-section { color: var(--grey); font-size: 12px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
  .q-text { color: var(--navy); font-size: 18px; font-weight: 500; line-height: 1.6; margin-bottom: 32px; }

  .qcm-options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; }
  .qcm-opt {
    display: flex; align-items: center; gap: 16px;
    background: var(--white); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    cursor: pointer; transition: all 0.2s;
  }
  .qcm-opt:hover { border-color: var(--gold); background: #EEF2FF; }
  .qcm-opt.selected { border-color: var(--navy); background: rgba(30,41,59,0.04); }
  .qcm-opt.selected .opt-key { background: var(--navy); color: var(--gold); }
  .opt-key {
    width: 34px; height: 34px; border-radius: 50%;
    background: #f0f0f0; color: #888;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; flex-shrink: 0;
    transition: all 0.2s;
  }
  .opt-text { font-size: 15px; color: var(--text); }

  .matrix-wrap {
    background: var(--white); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 24px;
    margin-bottom: 24px; overflow-x: auto;
  }
  .matrix-wrap svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }

  .likert-items { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
  .likert-item { background: var(--white); border-radius: var(--radius); padding: 20px 24px; border: 1px solid var(--border); }
  .likert-item .li-dim { font-size: 11px; color: var(--gold); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .likert-item .li-text { font-size: 15px; color: var(--navy); font-weight: 500; margin-bottom: 16px; line-height: 1.5; }
  .likert-scale { display: flex; flex-direction: column; gap: 8px; }
  .likert-labels { display: flex; justify-content: space-between; padding: 0 2px; }
  .likert-labels span { font-size: 11px; color: #aaa; }
  .likert-track { position: relative; height: 6px; background: #eee; border-radius: 3px; margin: 4px 0; }
  .likert-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.2s; pointer-events: none; }
  .likert-input {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; background: transparent;
    position: relative; z-index: 2; cursor: pointer; outline: none;
  }
  .likert-input::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--navy); border: 3px solid var(--gold);
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: transform 0.15s;
  }
  .likert-input::-webkit-slider-thumb:hover { transform: scale(1.15); }
  .likert-untouched::-webkit-slider-thumb { background: #ccc; border-color: #aaa; opacity: 0.5; }
  .likert-item.unanswered { border-left: 3px solid #f0c040; }
  .likert-item.unanswered .li-text::after { content: ' *'; color: #e8a020; font-size: 12px; }
  .likert-value-display { text-align: center; font-size: 12px; color: var(--grey); }
  .likert-value-display strong { color: var(--navy); font-size: 14px; }

  .sjt-scenario {
    background: var(--navy); border-radius: var(--radius);
    padding: 24px 28px; margin-bottom: 28px; color: var(--white);
    line-height: 1.7; font-size: 15px;
  }
  .sjt-scenario .sjt-label { color: var(--gold); font-size: 11px; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 10px; }
  .sjt-instruction { font-size: 13px; color: var(--grey); margin-bottom: 16px; }
  .sjt-columns { display: flex; gap: 20px; margin-bottom: 40px; }
  .sjt-col { flex: 1; }
  .sjt-col-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--grey); text-transform: uppercase; margin-bottom: 10px; padding: 0 4px; }
  .drop-zone {
    min-height: 280px; background: var(--white);
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.2s, background 0.2s;
  }
  .drop-zone.drag-over { border-color: var(--gold); background: #EEF2FF; }
  .sjt-card {
    background: #f8f8f8; border: 1.5px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
    cursor: grab; user-select: none; font-size: 14px; color: var(--text);
    transition: all 0.2s; display: flex; align-items: flex-start; gap: 10px;
  }
  .sjt-card:hover { border-color: var(--gold); background: #EEF2FF; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .sjt-card.dragging { opacity: 0.4; transform: scale(0.98); }
  .sjt-card .card-rank {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--navy); color: var(--gold);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sjt-card .card-key { font-size: 13px; font-weight: 700; color: #aaa; flex-shrink: 0; padding-top: 2px; }

  .value-group-title { font-size: 15px; color: var(--navy); font-weight: 600; margin-bottom: 6px; }
  .value-drag-hint {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.4);
    border-radius: 20px; padding: 6px 14px;
    font-size: 13px; color: #A33820; font-weight: 500; margin-bottom: 20px;
  }
  .value-card {
    flex: 1;
    background: var(--white); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 14px 10px;
    cursor: grab; user-select: none; text-align: center;
    transition: all 0.2s; position: relative;
  }
  .value-card:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(99,102,241,0.2); transform: translateY(-2px); }
  .value-card.dragging { opacity: 0.4; transform: scale(0.97); }
  .value-card .vc-drag { font-size: 12px; color: #ccc; position: absolute; top: 6px; left: 8px; letter-spacing: -1px; }
  .value-card .vc-icon { font-size: 26px; margin-bottom: 8px; display: block; }
  .value-card .vc-title { font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 3px; line-height: 1.3; }
  .value-card .vc-desc { font-size: 10px; color: #aaa; line-height: 1.4; }
  .value-cards-source { display: flex; gap: 10px; flex-wrap: nowrap; margin-bottom: 32px; }
  .value-rank-slots { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: nowrap; }
  .rank-slot {
    flex: 1;
    min-height: 110px; background: #fff;
    border: 2px dashed #c0c0c0; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px; padding: 10px 6px;
    transition: all 0.2s; box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
    position: relative;
  }
  .rank-slot .slot-badge {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: var(--gold);
    font-size: 11px; font-weight: 800; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .rank-slot .slot-label { font-size: 11px; color: #ccc; font-weight: 500; margin-top: 24px; }
  .rank-slot .slot-arrow { font-size: 16px; color: #ddd; }
  .rank-slot.drag-over { border-color: var(--gold); background: #EEF2FF; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
  .rank-slot.filled { border-color: var(--navy); background: rgba(30,41,59,0.03); border-style: solid; box-shadow: none; padding: 6px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 32px; border-radius: 6px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.2s; text-decoration: none;
  }
  .btn-primary {
    background: var(--gold); color: #ffffff;
    box-shadow: 0 4px 0 #4F46E5, 0 6px 12px rgba(0,0,0,0.15);
  }
  .btn-primary:hover { background: #F57057; transform: translateY(-1px); box-shadow: 0 5px 0 #4F46E5, 0 8px 16px rgba(0,0,0,0.18); }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #4F46E5, 0 2px 6px rgba(0,0,0,0.12); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-ghost { background: transparent; color: var(--grey); border: none; font-size: 14px; padding: 10px 16px; }
  .btn-ghost:hover { color: var(--navy); }

  .nav-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 40px;
    border-top: 1px solid var(--border);
    background: var(--white);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.07);
  }

  #screen-question { padding-bottom: 80px; }

  #screen-complete { background: var(--navy); align-items: center; justify-content: center; text-align: center; }
  .complete-title { color: var(--gold); font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-bottom: 16px; }

  #k-toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: var(--white);
    padding: 10px 22px; border-radius: 20px; font-size: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25); pointer-events: none;
    opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 200;
    max-width: 90vw; text-align: center;
  }
  #k-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #module-end-overlay {
    position: fixed; inset: 0; background: rgba(10,38,32,0.88);
    display: flex; align-items: center; justify-content: center; z-index: 300;
    animation: fadeIn 0.25s ease;
  }
  .me-box {
    background: white; border-radius: 14px; padding: 40px 48px;
    text-align: center; max-width: 420px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .me-icon { font-size: 40px; margin-bottom: 16px; }
  .me-title { color: var(--navy); font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .me-text { color: #777; font-size: 14px; line-height: 1.7; margin-bottom: 28px; }
  .me-actions { display: flex; gap: 12px; justify-content: center; }

  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

  .k-stepper { display: flex; gap: 6px; align-items: center; }
  .k-step {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: rgba(255,255,255,0.4);
    transition: all 0.3s;
  }
  .k-step.done { color: rgba(255,255,255,0.6); }
  .k-step.active { color: var(--gold); font-weight: 600; }
  .k-step-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.15); flex-shrink: 0; transition: all 0.3s;
  }
  .k-step.done .k-step-dot { background: rgba(255,255,255,0.4); }
  .k-step.active .k-step-dot { background: var(--gold); box-shadow: 0 0 6px rgba(99,102,241,0.5); }
  .k-step-sep { width: 16px; height: 1px; background: rgba(255,255,255,0.1); }

  #screen-loading { background: var(--navy); align-items: center; justify-content: center; text-align: center; }
  .loading-spinner {
    width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #screen-error { background: var(--navy); align-items: center; justify-content: center; text-align: center; }

  .consent-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 16px 20px;
    margin: 0 auto 24px;
    max-width: 480px;
    text-align: left;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .consent-box input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 2px; cursor: pointer; accent-color: var(--gold); }
  .consent-box label { color: rgba(255,255,255,0.7); font-size: 13px; line-height: 1.6; cursor: pointer; }
  .consent-box label a { color: var(--gold); text-decoration: none; }

  #final-submit-overlay {
    position: fixed; inset: 0; background: rgba(10,38,32,0.9);
    display: flex; align-items: center; justify-content: center; z-index: 400;
  }
  .fs-box {
    background: white; border-radius: 14px; padding: 40px 48px;
    text-align: center; max-width: 440px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .fs-box .fs-icon { font-size: 40px; margin-bottom: 16px; }
  .fs-box .fs-title { color: var(--navy); font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .fs-box .fs-text { color: #777; font-size: 14px; line-height: 1.7; margin-bottom: 28px; }
  .fs-box .fs-actions { display: flex; gap: 12px; justify-content: center; }

  @media (max-width: 600px) {
    .k-content { padding: 20px; }
    .sjt-columns { flex-direction: column; }
    .nav-bar { padding: 16px 20px; }
    .intro-modules { flex-direction: column; align-items: center; }
  }
  @media (max-width: 480px) {
    .value-cards-source { flex-wrap: wrap; }
    .value-rank-slots { flex-wrap: wrap; }
    .value-card { min-width: calc(50% - 6px); flex: none; }
    .rank-slot { min-width: calc(50% - 6px); flex: none; }
  }
</style>
</head>
<body>

<div id="screen-loading" class="screen active">
  <div style="text-align:center; padding:40px;">
    <div class="loader" aria-hidden="true" style="width:56px;height:56px;margin:0 auto 20px;border-radius:50%;border:4px solid rgba(199,210,254,0.25);border-top-color:#C7D2FE;animation:spin 0.9s linear infinite;"></div><style>@keyframes spin{to{transform:rotate(360deg);}}</style>
    <div data-i18n="loading_title" style="color:var(--gold);font-size:16px;font-weight:600;margin-bottom:8px;">Chargement de votre évaluation…</div>
    <div data-i18n="loading_subtitle" style="color:#aaa;font-size:13px;">Cela prend quelques secondes.</div>
  </div>
</div>

<div id="screen-error" class="screen">
  <div style="text-align:center; padding:60px 20px; max-width:480px; margin:0 auto;">
    <div id="error-icon" style="font-size:52px;margin-bottom:20px;">⚠️</div>
    <div id="error-title" data-i18n="err_title" style="color:var(--gold);font-size:22px;font-weight:700;margin-bottom:12px;">Une erreur est survenue</div>
    <div id="error-text" data-i18n="err_text_default" style="color:#aaa;font-size:14px;line-height:1.8;margin-bottom:32px;">Impossible de charger l'évaluation.</div>
    <button class="btn btn-primary" data-i18n="err_retry" onclick="location.reload()" style="margin-bottom:12px;">Réessayer</button>
    <div data-i18n="err_persist" style="color:#555;font-size:12px;margin-top:8px;">Si le problème persiste, contactez votre recruteur Acme Talent.</div>
  </div>
</div>

<div id="screen-intro" class="screen">
  <div style="padding:60px 20px; text-align:center; max-width:640px; margin:0 auto;">
    <div class="wordmark" style="font-size:calc(64px * 0.5); margin-bottom:32px; display:block; margin-left:auto; margin-right:auto;">ASSESSMENT</div>
    <div class="intro-title" data-i18n="intro_prepared_for">Évaluation préparée pour</div>
    <div class="intro-name" id="candidate-name">—</div>
    <div class="intro-modules" id="intro-modules-list">
          </div>
    <div class="intro-note" id="intro-note">
          </div>
    <div class="consent-box">
      <input type="checkbox" id="consent-check" onchange="document.getElementById('btn-start').disabled=!this.checked">
      <label for="consent-check" data-i18n-html="consent_text">
        J'accepte que mes réponses soient traitées par Acme Talent à des fins d'évaluation de recrutement, conformément à leur
        <a href="#" onclick="return false;">politique de confidentialité</a>. Je comprends que ce rapport est une aide à la décision et non une décision automatique me concernant (CCT n°38 · RGPD Art. 22).
      </label>
    </div>
    <button class="btn btn-primary" id="btn-start" data-i18n="btn_start_assessment" onclick="startAssessment()" disabled style="font-size:17px;padding:16px 48px;opacity:0.4;cursor:not-allowed;">
      Commencer l'évaluation →
    </button>
  </div>
</div>

<div id="screen-module-intro" class="screen">
  <div class="mi-wrap" style="margin:auto;">
    <div class="wordmark" style="font-size:calc(32px * 0.5); margin-bottom:28px; display:block;">ASSESSMENT</div>
    <div class="mi-num" id="mi-num"></div>
    <div class="mi-title" id="mi-title"></div>
    <div class="mi-desc" id="mi-desc"></div>
    <div class="mi-time" id="mi-time"></div>
    <div class="mi-instruction" id="mi-instruction"></div>
    <button class="btn btn-primary" data-i18n="btn_start_module" onclick="startModule()">Commencer ce module →</button>
  </div>
</div>

<div id="screen-question" class="screen">
  <div class="k-header">
    <div class="k-logo"><span class="wordmark" style="font-size:calc(22px * 0.7);margin-right:10px;">ASSESSMENT</span><span id="hdr-module">MODULE 1 · RAISONNEMENT</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div class="k-stepper" id="k-stepper"></div>
      <div class="k-progress-wrap">
        <div class="k-progress-label" id="hdr-progress"></div>
        <div class="k-progress-bar"><div class="k-progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="k-timer" id="k-timer"></div>
  </div>
  <div class="k-content" id="question-content">
      </div>
  <div class="nav-bar">
    <button class="btn btn-ghost" data-i18n="btn_prev" onclick="prevQuestion()" id="btn-prev">← Précédent</button>
    <button class="btn btn-primary" data-i18n="btn_next" onclick="nextQuestion()" id="btn-next">Suivant →</button>
  </div>
</div>

<div id="screen-complete" class="screen">
  <div id="complete-content" style="padding:60px 20px; text-align:center; max-width:580px; margin:0 auto;">
      </div>
</div>

<div id="k-toast"></div>

<script>
const APP_BUILD = "2026-05-07-submit-errors";
const API_BASE = (typeof window !== 'undefined' && window.ASSESSMENT_API_BASE) || 'http://localhost:8000';

function _extractToken() {
  const q = new URLSearchParams(location.search).get('token');
  if (q) return q;
  const m = location.pathname.match(/\/test\/([a-f0-9]{32})/i);
  return m ? m[1] : null;
}
const _token = _extractToken();
console.info(`[assessment] build=${APP_BUILD} api=${API_BASE} token=${(_token || '').slice(0, 8)}…`);

function _saveProgress() {
  if (!_token) return;
  try {
    localStorage.setItem(`kp_${_token}`, JSON.stringify({
      answers: state.answers,
      moduleIdx: state.moduleIdx,
      questionIdx: state.questionIdx,
      ts: Date.now()
    }));
  } catch(e) {}
}

function _restoreProgress() {
  if (!_token) return false;
  try {
    const raw = localStorage.getItem(`kp_${_token}`);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (Date.now() - d.ts > 7200000) { localStorage.removeItem(`kp_${_token}`); return false; }
    Object.assign(state, { answers: d.answers || {}, moduleIdx: d.moduleIdx || 0, questionIdx: d.questionIdx || 0 });
    return true;
  } catch(e) { return false; }
}

function _clearProgress() {
  if (_token) localStorage.removeItem(`kp_${_token}`);
}

function showError(type, msg) {
  const E = {
    token:     { icon:'🔗', titleKey:'err_invalid_title',   textKey:'err_invalid_text' },
    expired:   { icon:'⏰', titleKey:'err_expired_title',   textKey:'err_expired_text' },
    completed: { icon:'✅', titleKey:'err_completed_title', textKey:'err_completed_text' },
    network:   { icon:'📡', titleKey:'err_network_title',   textKey:'err_network_text' }
  };
  const e = E[type] || E.network;
  document.getElementById('error-icon').textContent  = e.icon;
  document.getElementById('error-title').textContent = K.t(e.titleKey);
  document.getElementById('error-text').textContent  = (type === 'network' && msg) ? msg : K.t(e.textKey);
  showScreen('screen-error');
}

async function initFromAPI() {
  if (!_token) {

    return showError('token');
  }

  showScreen('screen-loading');

  try {
    const sRes = await fetch(`${API_BASE}/api/v1/test/${_token}`);
    if (sRes.status === 404) return showError('token');
    if (!sRes.ok) throw new Error(`HTTP ${sRes.status}`);
    const session = await sRes.json();

    if (window.K && session.lang) K.setLang(session.lang);

    if (session.status === 'completed') return showError('completed');

    const nameEl = document.getElementById('candidate-name');
    if (nameEl && session.candidate_name) nameEl.textContent = session.candidate_name;

    const qRes = await fetch(`${API_BASE}/api/v1/test/${_token}/questions`);
    if (!qRes.ok) throw new Error(`Questions HTTP ${qRes.status}`);
    const questions = await qRes.json();

    MODULES.length = 0;
    _buildModulesFromAPI(questions).forEach(m => MODULES.push(m));
    if (MODULES.length === 0) {
      console.error('[assessment] API returned 0 questions for token', _token);
      return showError('network', 'Aucune question disponible pour cette session. Contactez votre recruteur.');
    }

    const restored = _restoreProgress();
    initIntro();
    showScreen('screen-intro');
    if (restored) setTimeout(() => showToast('✅ Progression restaurée'), 800);

  } catch(err) {
    console.error('[Acme Talent API]', err);
    showError('network', err.message);
  }
}

function _buildModulesFromAPI(questions) {
  const byMod = {1:[], 2:[], 3:[], 4:[]};
  questions.forEach(q => { if (byMod[q.module]) byMod[q.module].push(q); });
  const mods = [];

  const T = (k) => (window.K ? K.t(k) : k);

  if (byMod[1].length) {
    mods.push({
      id:'m1_api', num: `${T('module_label')} 1`, title: T('m1_title'),
      desc: T('m1_intro_short'),
      time: 30*60, timeLabel:'30 minutes',
      instruction: T('m1_intro_short'),
      header: T('m1_section_label'),
      questions: byMod[1].map(q => ({
        id: q.id, section: q.category || T('m1_short_title'), type:'qcm',
        text: q.text, instruction: q.instruction || null,
        options: (q.options||[]).map(o=>({k:o.id, v:o.text})),
        _apiId: q.id, _apiModule: 1
      }))
    });
  }

  if (byMod[2].length) {
    const bsz = 5;
    const batches = [];
    for (let i=0; i<byMod[2].length; i+=bsz) {
      const slice = byMod[2].slice(i, i+bsz);
      batches.push({
        id:`m2b_${i}`, section: T('m2_title'), type:'likert', batchSize:bsz,
        items: slice.map(q => ({
          id: q.id,
          dim: T('ocean_' + ((q.meta||{}).dimension || 'O')),
          inv: (q.meta||{}).inverted || false,
          text: q.text, _apiId: q.id
        }))
      });
    }
    mods.push({
      id:'m2_api', num: `${T('module_label')} 2`, title: T('m2_title'),
      desc: T('m2_short_description'),
      time:10*60, timeLabel:'10 minutes',
      instruction: T('m2_likert_instruction'),
      header: `${T('module_label')} 2 · ${T('m2_title').toUpperCase()}`, questions: batches
    });
  }

  if (byMod[3].length) {
    mods.push({
      id:'m3_api', num: `${T('module_label')} 3`, title: T('m3_title'),
      desc: T('m3_description'),
      time:20*60, timeLabel:'20 minutes',
      instruction: T('m3_instruction'),
      header: `${T('module_label')} 3 · ${T('m3_title').toUpperCase()}`,
      questions: byMod[3].map((q,i) => ({
        id: q.id, section:`${i+1} / ${byMod[3].length}`, type:'sjt',
        scenario: q.text, instruction: q.instruction,
        options: (q.options||[]).map(o=>({k:o.id, text:o.text})),
        _apiId: q.id, _apiModule: 3
      }))
    });
  }

  if (byMod[4].length) {
    const rankQs  = byMod[4].filter(q => q.type === 'ranking');
    const likertQs = byMod[4].filter(q => q.type === 'likert');
    const m4Qs = [];
    const icons = {A:'🎯',B:'🤝',C:'📚',D:'🔑',E:'💡',F:'⚡',G:'🌱',H:'🏆'};

    rankQs.forEach((q, i) => {
      if ((q.options||[]).length >= 2) {
        m4Qs.push({
          id: q.id, type:'value_rank',
          section: T('m4_section_a'),
          groupTitle: q.text || '',
          groupNum: `${i+1} / ${rankQs.length}`,
          cards: q.options.map(o => ({k:o.id, icon:icons[o.id]||'✦', title:o.text, desc:''})),
          _apiId: q.id, _apiModule: 4
        });
      }
    });

    if (likertQs.length) {
      m4Qs.push({
        id:'m4_eng_api', type:'likert', batchSize: Math.min(6, likertQs.length),
        section: T('m4_title'),
        items: likertQs.map(q => ({
          id: q.id, dim: T('m4_title'), inv:(q.meta||{}).inverted||false,
          text: q.text, _apiId: q.id
        }))
      });
    }

    if (m4Qs.length) {
      mods.push({
        id:'m4_api', num: `${T('module_label')} 4`, title: T('m4_title'),
        desc: T('m4_description'),
        time:12*60, timeLabel:'12 minutes',
        instruction: T('m4_instruction'),
        header: `${T('module_label')} 4 · ${T('m4_title').toUpperCase()}`, questions: m4Qs
      });
    }
  }

  return mods;
}

async function submitToAPI() {
  if (!_token) return {ok: false, error: 'No token'};
  const answers = [];

  MODULES.forEach((mod, mIdx) => {
    const modNum = mIdx + 1;
    mod.questions.forEach(q => {
      const qid = q._apiId || q.id;
      const mNum = q._apiModule || modNum;

      if (q.type === 'qcm' || q.type === 'matrix') {
        const ans = state.answers[q.id];
        if (ans !== undefined) answers.push({question_id:qid, module:mNum, response:{selected:ans}});

      } else if (q.type === 'likert') {
        (q.items||[]).forEach(item => {
          const v = state.answers[item.id];
          const iq = item._apiId || item.id;
          if (v !== undefined) answers.push({question_id:iq, module:mNum, response:{value:v}});
        });

      } else if (q.type === 'sjt') {
        const r = state.answers[q.id];
        if (r && r.length) answers.push({question_id:qid, module:mNum, response:{ranking:r}});

      } else if (q.type === 'value_rank') {
        const saved = state.answers[q.id] || {};
        const order = Object.keys(saved).sort((a,b)=>+a-+b).map(k=>saved[k]);
        if (order.length) answers.push({question_id:qid, module:mNum, response:{ranking:order}});
      }
    });
  });

  console.info(`[assessment] submit — ${answers.length} answers across modules:`,
    [...new Set(answers.map(a => a.module))].sort());

  try {
    const res = await fetch(`${API_BASE}/api/v1/test/${_token}/submit`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({answers})
    });
    if (res.ok) {
      _clearProgress();
      return {ok: true};
    }
    let detail = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      if (body && body.detail) detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
    } catch (_) {
      try { detail = await res.text(); } catch (_) {}
    }
    console.error('[submit] failed:', detail);
    return {ok: false, error: detail};
  } catch(e) {
    console.error('[submit] network error:', e);
    return {ok: false, error: e.message || 'Erreur réseau'};
  }
}

function updateStepper() {
  const el = document.getElementById('k-stepper');
  if (!el || !MODULES.length) return;
  el.innerHTML = MODULES.map((m, i) => {
    const cls = i < state.moduleIdx ? 'done' : i === state.moduleIdx ? 'active' : '';
    const label = i < state.moduleIdx ? '✓' : `M${i+1}`;
    const sep = i < MODULES.length - 1 ? '<div class="k-step-sep"></div>' : '';
    return `<div class="k-step ${cls}"><div class="k-step-dot"></div>${label}</div>${sep}`;
  }).join('');
}

function showFinalConfirm() {
  if (document.getElementById('final-submit-overlay')) return;
  const total = MODULES.reduce((s,m) => s + m.questions.length, 0);
  const answered = MODULES.reduce((s,m) => s + m.questions.filter(q => isQuestionAnswered(q)).length, 0);
  const unanswered = total - answered;

  const overlay = document.createElement('div');
  overlay.id = 'final-submit-overlay';
  const unansweredSuffix = unanswered > 1 ? K.t('end_unanswered_suffix_plural') : K.t('end_unanswered_suffix_singular');
  overlay.innerHTML = `<div class="fs-box">
    <div class="fs-icon">🎯</div>
    <div class="fs-title">${K.t('end_finish_title')}</div>
    <div class="fs-text">
      ${unanswered > 0
        ? `<strong style="color:#6366F1;">${unanswered} ${unansweredSuffix}.</strong><br>`
        : ''}
      ${K.t('end_irreversible')}
    </div>
    <div class="fs-actions">
      <button class="btn btn-ghost" style="border:2px solid #ddd;border-radius:6px;" onclick="document.getElementById('final-submit-overlay').remove()">${K.t('btn_back')}</button>
      <button class="btn btn-primary" onclick="document.getElementById('final-submit-overlay').remove(); _doSubmit()">${K.t('btn_confirm')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

async function _doSubmit() {
  stopTimer();
  showScreen('screen-loading');
  document.querySelector('#screen-loading div div:first-child + div').textContent = K.t('submitting');
  const result = await submitToAPI();
  if (!result.ok) {
    return showError('network', result.error || 'Erreur lors de l\'envoi des réponses.');
  }
  showComplete();
}

const MODULES = [];

let state = {
  moduleIdx: 0,
  questionIdx: 0,
  answers: {},
  timerInterval: null,
  timeLeft: 0,
  phase: 'intro',
  startTime: null
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function initIntro() {
  const list = document.getElementById('intro-modules-list');
  if (!list) return;
  const totalMin = Math.round(MODULES.reduce((s, m) => s + m.time, 0) / 60);
  list.innerHTML = MODULES.map((m, i) =>
    `<div class="intro-module">
      <div class="mod-label">${K.t('module_label')} ${i + 1}</div>
      <div class="mod-name">${m.title}</div>
      <div class="mod-time">⏱ ${m.timeLabel}</div>
    </div>`
  ).join('');
  const note = document.getElementById('intro-note');
  if (note) note.innerHTML = `${K.t('intro_duration_lead')} <strong>${totalMin} ${K.t('intro_duration_unit')}</strong>.<br>${K.t('intro_setup')}`;
}

initFromAPI();

async function startAssessment() {

  if (_token) {
    try {
      const res = await fetch(`${API_BASE}/api/v1/test/${_token}/start`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({consent_given: true, consent_version: 'v1.0'})
      });
      if (!res.ok && res.status !== 400) {
        const err = await res.json().catch(() => ({}));
        if (err.detail && err.detail.includes('complété')) return showError('completed');
      }
    } catch(e) { console.warn('[start]', e);  }
  }

  const hasRestored = state.moduleIdx > 0 || state.questionIdx > 0;
  if (!hasRestored) {
    state.moduleIdx  = 0;
    state.questionIdx = 0;
  }
  state.startTime = Date.now();
  showModuleIntro();
}

function showComplete() {
  const elapsed = state.startTime ? Math.round((Date.now() - state.startTime) / 60000) : 0;
  const modSummary = MODULES.map((m, i) => {
    const mAnswered = m.questions.filter(q => isQuestionAnswered(q)).length;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);">
      <span style="color:#ccc;font-size:14px;">${m.title}</span>
      <span style="color:var(--gold);font-size:13px;font-weight:600;">${mAnswered}/${m.questions.length} ${K.t('answered_suffix')}</span>
    </div>`;
  }).join('');
  document.getElementById('complete-content').innerHTML = `
    <div style="font-size:52px;margin-bottom:20px;">🎯</div>
    <div class="complete-title">${K.t('complete_title')}</div>
    <div style="color:#aaa;font-size:16px;line-height:1.8;margin-bottom:24px;">${K.t('complete_thanks')}</div>
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:20px 28px;margin-bottom:32px;text-align:left;">
      ${modSummary}
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;">
        <span style="color:#aaa;font-size:13px;">${K.t('complete_total_duration')}</span>
        <span style="color:var(--gold);font-size:14px;font-weight:700;">${elapsed < 1 ? K.t('duration_under_one') : elapsed + ' ' + K.t('duration_minutes_suffix')}</span>
      </div>
    </div>
    <div style="color:#aaa;font-size:14px;line-height:1.8;margin-bottom:24px;">${K.t('complete_followup')}</div>
    <div style="color:#444;font-size:12px;">${K.t('footer_acme')}</div>`;
  showScreen('screen-complete');
}

function showModuleIntro() {
  window.scrollTo(0, 0);
  const mod = MODULES[state.moduleIdx];
  const seqNum = state.moduleIdx + 1;
  document.getElementById('mi-num').textContent = K.t('module_label') + ' ' + seqNum + ' / ' + MODULES.length;
  document.getElementById('mi-title').textContent = mod.title;
  document.getElementById('mi-desc').textContent = mod.desc;
  document.getElementById('mi-time').textContent = '⏱ ' + mod.timeLabel;
  document.getElementById('mi-instruction').textContent = mod.instruction;
  showScreen('screen-module-intro');
}

function startModule() {
  const mod = MODULES[state.moduleIdx];
  state.questionIdx = 0;
  state.timeLeft = mod.time;
  startTimer();
  renderQuestion();
  showScreen('screen-question');
}

function prevQuestion() {
  if (state.questionIdx > 0) {
    state.questionIdx--;
    renderQuestion();
  }
}

function isQuestionAnswered(q) {
  if (!q) return false;
  if (q.type === 'qcm' || q.type === 'matrix') return state.answers[q.id] !== undefined;
  if (q.type === 'likert') return q.items.every(item => state.answers[item.id] !== undefined);
  if (q.type === 'sjt') return (state.answers[q.id] || []).length === q.options.length;
  if (q.type === 'value_rank') return Object.keys(state.answers[q.id] || {}).length === q.cards.length;
  return true;
}

let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('k-toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function advanceModule() {
  stopTimer();
  state.moduleIdx++;
  _saveProgress();
  if (state.moduleIdx < MODULES.length) {
    showModuleIntro();
  } else {

    showFinalConfirm();
  }
}

function showModuleEndConfirm(unansweredCount) {
  const existing = document.getElementById('module-end-overlay');
  if (existing) existing.remove();
  const isLastModule = state.moduleIdx === MODULES.length - 1;
  const continueLabel = isLastModule ? K.t('end_finish_now') : K.t('end_continue_module');
  const unansweredSuffix = unansweredCount > 1 ? K.t('end_unanswered_suffix_plural') : K.t('end_unanswered_suffix_singular');
  const overlay = document.createElement('div');
  overlay.id = 'module-end-overlay';
  overlay.innerHTML = `
    <div class="me-box">
      <div class="me-icon">⚠️</div>
      <div class="me-title">${unansweredCount} ${unansweredSuffix}</div>
      <div class="me-actions">
        <button class="btn btn-ghost" style="border:2px solid #ddd;border-radius:6px;" onclick="document.getElementById('module-end-overlay').remove()">${K.t('btn_back')}</button>
        <button class="btn btn-primary" onclick="document.getElementById('module-end-overlay').remove(); advanceModule();">${continueLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function nextQuestion() {
  const mod = MODULES[state.moduleIdx];
  const q = mod.questions[state.questionIdx];

  if (state.questionIdx < mod.questions.length - 1) {

    if (!isQuestionAnswered(q)) showToast('⚠️ Question sans réponse');
    state.questionIdx++;
    renderQuestion();
  } else {

    const unanswered = mod.questions.filter(q => !isQuestionAnswered(q)).length;
    if (unanswered > 0) {
      showModuleEndConfirm(unanswered);
    } else {
      advanceModule();
    }
  }
}

function startTimer() {
  stopTimer();
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      timeUp();
    }
  }, 1000);
}

function timeUp() {
  stopTimer();

  const existing = document.getElementById('time-up-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.id = 'time-up-overlay';
  overlay.style.cssText = [
    'position:fixed','inset:0','background:rgba(10,38,32,0.93)',
    'display:flex','flex-direction:column','align-items:center','justify-content:center',
    'z-index:9999','animation:fadeIn 0.3s ease'
  ].join(';');
  const isLastMod = state.moduleIdx === MODULES.length - 1;
  const nextLabel = isLastMod ? K.t('end_finish_now') : K.t('time_per_module');
  overlay.innerHTML = `
    <div style="font-size:60px;margin-bottom:20px;">⏰</div>
    <div style="color:#6366F1;font-size:26px;font-weight:700;letter-spacing:3px;margin-bottom:12px;">${K.t('time_up_title')}</div>
    <div style="color:#aaa;font-size:15px;">${nextLabel}</div>
  `;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.remove();
    state.moduleIdx++;
    if (state.moduleIdx < MODULES.length) {
      showModuleIntro();
    } else {
      showComplete();
    }
  }, 2800);
}

function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
}

function updateTimerDisplay() {
  const el = document.getElementById('k-timer');
  if (!el) return;
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  el.textContent = m + ':' + s;
  el.classList.toggle('warning', state.timeLeft <= 120);
}

function renderQuestion() {
  window.scrollTo(0, 0);
  const mod = MODULES[state.moduleIdx];
  const q = mod.questions[state.questionIdx];
  const total = mod.questions.length;
  const pct = ((state.questionIdx + 1) / total * 100).toFixed(0);

  document.getElementById('hdr-module').textContent = 'MODULE ' + (state.moduleIdx + 1) + ' · ' + mod.title.toUpperCase();
  document.getElementById('hdr-progress').textContent = 'Q' + (state.questionIdx+1) + ' / ' + total + ' · Module ' + (state.moduleIdx+1) + '/' + MODULES.length;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-prev').style.visibility = state.questionIdx === 0 ? 'hidden' : 'visible';
  updateStepper();
  _saveProgress();

  const isLast = state.questionIdx === total - 1;
  const isLastModule = state.moduleIdx === MODULES.length - 1;
  document.getElementById('btn-next').textContent = isLast
    ? (isLastModule ? 'Terminer l\'évaluation ✓' : 'Module suivant →')
    : 'Suivant →';

  const container = document.getElementById('question-content');
  container.className = 'k-content fade-in';

  if (q.type === 'qcm') renderQCM(container, q);
  else if (q.type === 'matrix') renderMatrix(container, q);
  else if (q.type === 'likert') renderLikert(container, q);
  else if (q.type === 'sjt') renderSJT(container, q);
  else if (q.type === 'value_rank') renderValueRank(container, q);
}

function renderQCM(container, q) {
  const saved = state.answers[q.id] || null;
  container.innerHTML = `
    <div class="q-section">${q.section}</div>
    <div class="q-text">${q.text}</div>
    <div class="qcm-options">
      ${q.options.map(o => `
        <div class="qcm-opt ${saved===o.k?'selected':''}" onclick="selectQCM('${q.id}','${o.k}',this.parentElement)">
          <div class="opt-key">${o.k}</div>
          <div class="opt-text">${o.v}</div>
        </div>
      `).join('')}
    </div>`;
}

function selectQCM(qid, key, parent) {
  state.answers[qid] = key;
  parent.querySelectorAll('.qcm-opt').forEach(el => {
    el.classList.toggle('selected', el.querySelector('.opt-key').textContent === key);
  });
}

function _likertLabels() { return [K.t('likert_1'), K.t('likert_2'), K.t('likert_3'), K.t('likert_4'), K.t('likert_5')]; }
const LIKERT_LABELS = new Proxy({}, { get(_, prop) { const arr = _likertLabels(); return arr[prop]; } });

function renderLikert(container, q) {
  const sectionHtml = q.section ? `<div class="q-section">${q.section}</div>` : '';
  container.innerHTML = `
    ${sectionHtml}
    <div class="likert-items">
      ${q.items.map(item => {
        const saved = state.answers[item.id];
        const isAnswered = saved !== undefined;
        const displayVal = isAnswered ? saved : 3;
        const pct = isAnswered ? ((saved-1)/4*100).toFixed(0) : 0;
        return `
        <div class="likert-item ${isAnswered ? '' : 'unanswered'}">
          <div class="li-dim">${item.dim}${item.inv ? ' · ' + K.t('likert_inverted_tag') : ''}</div>
          <div class="li-text">${item.text}</div>
          <div class="likert-scale">
            <div style="position:relative;height:22px;">
              <div class="likert-track" style="margin-top:8px;">
                <div class="likert-fill" id="lf-${item.id}" style="width:${pct}%"></div>
              </div>
              <input type="range" class="likert-input ${isAnswered ? '' : 'likert-untouched'}" min="1" max="5" value="${displayVal}"
                id="li-${item.id}"
                oninput="updateLikert('${item.id}',this.value)"
                style="position:absolute;top:0;left:0;width:100%;"/>
            </div>
            <div class="likert-labels">
              <span>1 — ${K.t('likert_1')}</span>
              <span style="text-align:center;">3 — ${K.t('likert_3')}</span>
              <span style="text-align:right;">5 — ${K.t('likert_5')}</span>
            </div>
            <div class="likert-value-display">
              <strong id="lv-${item.id}">${isAnswered ? LIKERT_LABELS[saved-1] : '—'}</strong>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function updateLikert(id, val) {
  val = parseInt(val);
  state.answers[id] = val;
  const pct = ((val-1)/4*100).toFixed(0);
  const fill = document.getElementById('lf-'+id);
  const lbl = document.getElementById('lv-'+id);
  const input = document.getElementById('li-'+id);
  if (fill) fill.style.width = pct + '%';
  if (lbl) lbl.textContent = LIKERT_LABELS[val-1];

  if (input) {
    input.classList.remove('likert-untouched');
    input.closest('.likert-item').classList.remove('unanswered');
  }
}

function renderSJT(container, q) {
  const saved = state.answers[q.id] || [];
  container.innerHTML = `
    <div class="q-section">${q.section}</div>
    ${q.illustration ? `
    <div style="display:flex;align-items:center;gap:14px;background:${q.illustration.color}18;border-left:4px solid ${q.illustration.color};border-radius:0 8px 8px 0;padding:12px 18px;margin-bottom:16px;">
      <span style="font-size:32px;line-height:1;">${q.illustration.icon}</span>
      <span style="font-size:12px;font-weight:700;color:${q.illustration.color};letter-spacing:1px;text-transform:uppercase;">${q.illustration.label}</span>
    </div>` : ''}
    <div class="sjt-scenario">
      <div class="sjt-label">${K.t('m3_situation_label')}</div>
      ${q.scenario}
    </div>
    <div class="sjt-instruction">${K.t('m3_drag_hint')}</div>
    <div class="sjt-columns">
      <div class="sjt-col">
        <div class="sjt-col-label">${K.t('m3_col_available')}</div>
        <div class="drop-zone" id="sjt-source" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropToSource(event)">
          ${q.options.filter(o => !saved.includes(o.k)).map(o => `
            <div class="sjt-card" draggable="true" data-key="${o.k}"
              ondragstart="dragStart(event,'${o.k}')"
              ondragend="dragEnd(event)">
              <div class="card-key">${o.k}</div>
              <div>${o.text}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="sjt-col">
        <div class="sjt-col-label">${K.t('m3_col_ranked')}</div>
        <div class="drop-zone" id="sjt-ranked" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropToRanked(event,'${q.id}')">
          ${saved.map((k,i) => {
            const opt = q.options.find(o=>o.k===k);
            return `<div class="sjt-card" draggable="true" data-key="${k}"
              ondragstart="dragStart(event,'${k}')"
              ondragend="dragEnd(event)">
              <div class="card-rank">${i+1}</div>
              <div>${opt.text}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
}

let draggedKey = null;

function dragStart(e, key) {
  draggedKey = key;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); draggedKey = null; }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

function dropToRanked(e, qid) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedKey) return;
  const q = MODULES[state.moduleIdx].questions[state.questionIdx];
  const ranked = [...(state.answers[qid] || [])];

  const existingIdx = ranked.indexOf(draggedKey);
  if (existingIdx > -1) ranked.splice(existingIdx, 1);

  const cards = e.currentTarget.querySelectorAll('.sjt-card');
  let insertIdx = ranked.length;
  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) { insertIdx = i; break; }
  }
  ranked.splice(insertIdx, 0, draggedKey);
  state.answers[qid] = ranked;
  renderSJT(document.getElementById('question-content'), q);
}

function dropToSource(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedKey) return;
  const q = MODULES[state.moduleIdx].questions[state.questionIdx];
  const ranked = state.answers[q.id] || [];
  const idx = ranked.indexOf(draggedKey);
  if (idx > -1) { ranked.splice(idx,1); state.answers[q.id] = ranked; }
  renderSJT(document.getElementById('question-content'), q);
}

function renderValueRank(container, q) {
  const saved = state.answers[q.id] || {};
  const usedKeys = Object.values(saved);
  container.innerHTML = `
    <div class="q-section">${q.section}</div>
    <div class="value-group-title">${q.groupNum} · ${q.groupTitle}</div>
    <div class="value-drag-hint">${K.t('m4_drag_hint')}</div>

    <div class="value-rank-slots">
      ${[1,2,3,4].map(n => {
        const cardKey = saved[n];
        const card = cardKey ? q.cards.find(c=>c.k===cardKey) : null;
        return `<div class="rank-slot ${card?'filled':''}" id="slot-${q.id}-${n}"
          ondragover="dragOver(event)" ondragleave="dragLeave(event)"
          ondrop="dropValueCard(event,'${q.id}',${n})">
          <div class="slot-badge">${n}</div>
          ${card
            ? `<div class="value-card" style="border:none;box-shadow:none;cursor:grab;width:100%;margin-top:4px;" draggable="true" data-key="${card.k}"
                ondragstart="dragStart(event,'${card.k}')" ondragend="dragEnd(event)">
                <div class="vc-drag">⠿</div>
                <span class="vc-icon">${card.icon}</span>
                <div class="vc-title">${card.title}</div>
              </div>`
            : `<div class="slot-label">déposez ici</div><div class="slot-arrow">⬇</div>`}
        </div>`;
      }).join('')}
    </div>

    <div class="sjt-col-label" style="margin-bottom:10px;">${K.t('m4_available_cards')}</div>
    <div class="value-cards-source" id="cards-source-${q.id}"
      ondragover="dragOver(event)" ondragleave="dragLeave(event)"
      ondrop="dropValueToSource(event,'${q.id}')">
      ${q.cards.filter(c => !usedKeys.includes(c.k)).map(c => `
        <div class="value-card" draggable="true" data-key="${c.k}"
          ondragstart="dragStart(event,'${c.k}')" ondragend="dragEnd(event)">
          <div class="vc-drag">⠿</div>
          <span class="vc-icon">${c.icon}</span>
          <div class="vc-title">${c.title}</div>
          <div class="vc-desc">${c.desc}</div>
        </div>`).join('')}
      ${usedKeys.length === 4
        ? `<div style="color:#2d9e6b;font-size:13px;font-weight:600;padding:16px;text-align:center;width:100%;">${K.t('m4_all_placed')}</div>`
        : ''}
    </div>`;
}

function dropValueCard(e, qid, rank) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedKey) return;
  const q = MODULES[state.moduleIdx].questions[state.questionIdx];
  const saved = state.answers[qid] || {};

  Object.keys(saved).forEach(r => { if (saved[r] === draggedKey) delete saved[r]; });
  saved[rank] = draggedKey;
  state.answers[qid] = saved;
  renderValueRank(document.getElementById('question-content'), q);
}

function dropValueToSource(e, qid) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!draggedKey) return;
  const q = MODULES[state.moduleIdx].questions[state.questionIdx];
  const saved = state.answers[qid] || {};
  Object.keys(saved).forEach(r => { if (saved[r] === draggedKey) delete saved[r]; });
  state.answers[qid] = saved;
  renderValueRank(document.getElementById('question-content'), q);
}
</script>
